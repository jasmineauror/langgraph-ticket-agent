# Eval fixtures: hand-written tickets with the behavior we assert.
#
# Assertion vocabulary (see evals/assertions.py):
#   must_auto_reply       graph must terminate in AUTO_REPLY
#   must_not_auto_reply   graph must NOT terminate in AUTO_REPLY
#   must_escalate         graph must terminate in ESCALATE
#   terminated_by         which node must have made the terminal decision
#   must_reach_retriever  the ticket must not be short-circuited before retrieval
#   must_cite_source      these sources must appear in cited_sources
#   must_contain          these substrings must appear in the reply
#   must_contain_any      each group: at least one member must appear
#   must_not_contain      these substrings must NOT appear in the reply
#   expected_category     classifier must produce this category
#   expected_reason       escalation_reason must contain this
#   any_of                at least one nested assertion block must hold
#
# terminated_by exists because an earlier version of this suite reported 5/6
# passing while four fixtures never reached the retriever at all: the classifier
# short-circuited them and the assertions, which only checked outcomes, were
# satisfied. A right answer from the wrong mechanism is a test that stops
# testing the moment that node changes its mind.

- id: normal-billing
  why: >
    The happy path. A plain documentation question with a clear answer in the
    knowledge base. If this fails, retrieval or the response format is broken.
  ticket: |
    Hi, I need to submit last month's invoice for an expense report. Where do I
    download invoice PDFs from? I can't find them anywhere in the dashboard.
  assert:
    expected_category: billing
    must_reach_retriever: true
    terminated_by: judge
    must_auto_reply: true
    must_cite_source: [billing-invoices.md]
    must_contain: ["settings"]

- id: technical-in-kb
  why: >
    A specific factual question whose answer is a number in the knowledge base.
    Catches a responder that answers plausibly but not from the retrieved text.
  ticket: |
    We're on the Growth plan. What's our API rate limit, and what should our
    client do when it gets throttled?
  assert:
    expected_category: technical
    must_reach_retriever: true
    terminated_by: judge
    must_auto_reply: true
    must_cite_source: [tech-api-rate-limits.md]
    must_contain: ["600"]
    # The throttling half of the question is answered correctly by naming the
    # status code OR the correct client behaviour. Demanding the literal "429"
    # failed a reply that said "honor the Retry-After header and apply
    # exponential backoff" -- correct, grounded, and cited.
    must_contain_any:
      - ["429", "retry-after", "backoff"]

- id: abusive
  why: >
    Must escalate without spending retrieval or drafting on it. The classifier
    short-circuit should fire, so no draft should ever be produced. Here
    terminated_by=classifier is the REQUIREMENT, not an accident -- routing this
    to a human is the cheapest correct behavior for the worst input.
  ticket: |
    This is the third time I'm writing and your garbage product is still broken.
    Your support team are complete idiots and I'm going to make sure everyone
    knows it. Fix it NOW or I'll destroy you online.
  assert:
    expected_category: abusive_or_out_of_scope
    terminated_by: classifier
    must_escalate: true
    must_not_auto_reply: true

- id: refund-request-action
  why: >
    Asks the system to DO something irreversible to an account. The classifier
    should catch it on those grounds alone, before retrieval, because no amount
    of documentation makes "process my refund" auto-answerable.
  ticket: |
    We barely used Meridian for the last three months and I'd like a refund for
    that period. Can you process that and confirm the amount back to my card?
  assert:
    expected_category: billing
    terminated_by: classifier
    must_escalate: true
    must_not_auto_reply: true
    must_not_contain: ["i have processed", "i've processed", "refund has been issued"]

- id: refund-policy-question
  why: >
    The companion to the fixture above, and it covers a real gap: it asks a
    QUESTION about refunds rather than requesting an action, so the classifier
    must pass it through. The knowledge base deliberately contains no refund
    policy, so the judge has to escalate it on grounding and sensitivity --
    which is the judge path nothing else in this suite exercises.
  ticket: |
    Before we commit to an annual plan, what's your refund policy if we decide
    to cancel six months in? Just want to understand the terms up front.
  assert:
    expected_category: billing
    must_reach_retriever: true
    terminated_by: judge
    must_escalate: true
    must_not_auto_reply: true
    # A hallucinating responder invents a policy that sounds plausible.
    must_not_contain:
      - "pro-rated refund"
      - "30-day"
      - "you will receive a refund"
      - "our refund policy is"

- id: no-kb-answer
  why: >
    THE fixture. Asks something the knowledge base genuinely cannot answer.
    Retrieval returns low-similarity chunks about integrations and SSO. The
    correct behavior is to decline and escalate, not to invent a plausible
    answer. must_reach_retriever is what stops this passing for the wrong
    reason -- it previously escalated at the classifier, so the grounding check
    it exists to test was never run.
  ticket: |
    Does Meridian offer a self-hosted or on-premise deployment for customers who
    can't use cloud SaaS for compliance reasons? If so, what does it cost and
    what's the minimum contract?
  assert:
    must_reach_retriever: true
    terminated_by: judge
    must_escalate: true
    must_not_auto_reply: true
    must_not_contain:
      - "$"
      - "per year"
      - "yes, meridian offers"
      - "yes, we offer"
      - "minimum contract"

- id: ambiguous-two-issues
  why: >
    Genuinely ambiguous, so the assertion is genuinely a disjunction rather
    than a guess. Two unrelated problems, one a documentation question and one
    an account-specific billing discrepancy. Escalating is correct; so is
    answering both parts from the knowledge base. Deliberately does NOT assert
    terminated_by, because either node deciding is defensible here -- pinning a
    mechanism onto an ambiguous input would be fitting the test to the
    implementation.
  ticket: |
    Two things. Our webhook endpoint stopped receiving events sometime last week
    and I don't know why. Also, we removed two team members last month but I
    think we're still being billed for their seats.
  assert:
    any_of:
      - must_escalate: true
      - must_auto_reply: true
        # Originally required billing-plan-changes.md. An ablation run showed
        # retrieval never surfaces it for this ticket -- the top 4 chunks are
        # webhooks twice, team-members, and deletion -- so that branch was
        # unsatisfiable, and the fixture was failing drafts for not citing a
        # document they were never shown. Assert a billing source was used, not
        # which one.
        must_cite_source: [tech-webhooks.md]
        must_contain_any:
          - ["seat", "billing cycle", "billed"]
